name: Robot Treasure - Remotion + Kokoro
on:
  push:
    branches: [experiment/robot-treasure-remotion-v1]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: experiments/remotion-smoke
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm install --no-audit --no-fund
      - name: Cache Kokoro model files
        uses: actions/cache@v4
        with:
          path: experiments/remotion-smoke/models/kokoro
          key: kokoro-onnx-v1-int8-voices-v1
      - name: Install and synthesize local Kokoro narration
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq espeak-ng ffmpeg
          python -m pip install numpy scipy 'kokoro-onnx>=0.3' 'onnxruntime>=1.16' soundfile
          mkdir -p models/kokoro
          cd models/kokoro
          for file in kokoro-v1.0.int8.onnx voices-v1.0.bin; do
            if [ ! -s "$file" ]; then
              curl -fL --retry 3 "https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/$file" -o "$file.tmp"
              mv "$file.tmp" "$file"
            fi
          done
          cd ../..
          python scripts/make_robot_audio.py
      - name: Render native Remotion composition
        run: |
          mkdir -p out
          npx remotion render src/robot.jsx RobotTreasure out/robot-treasure-kokoro.mp4 --codec h264 --concurrency 2
      - name: Validate MP4
        run: |
          ffprobe -v error -show_streams -show_format -of json out/robot-treasure-kokoro.mp4 > out/probe.json
          ffmpeg -v error -xerror -i out/robot-treasure-kokoro.mp4 -f null -
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('out/probe.json').read_text())
          v=[s for s in d['streams'] if s['codec_type']=='video']
          a=[s for s in d['streams'] if s['codec_type']=='audio']
          assert len(v)==len(a)==1
          assert (v[0]['width'],v[0]['height'])==(1080,1920)
          assert v[0]['codec_name']=='h264' and a[0]['codec_name']=='aac'
          assert v[0]['r_frame_rate']=='30/1' and int(v[0]['nb_frames'])==360
          assert abs(float(d['format']['duration'])-12)<0.08
          print('Native Remotion: 360 frames, 1080x1920, 30 fps, H264/AAC, full decode passed')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: robot-treasure-kokoro
          path: experiments/remotion-smoke/out/
          retention-days: 30
